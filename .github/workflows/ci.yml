name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python
        run: python -m compileall -q antidetect
      - name: Encryption round-trip
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, '.')
          from antidetect import profileio
          bundle = {"version": 1, "profile": {"name": "CI"}, "cookies": []}
          sealed = profileio.encrypt_bundle(bundle, "kata-sandi-ci")
          assert profileio.is_encrypted(sealed)
          assert profileio.decrypt_bundle(sealed, "kata-sandi-ci") == bundle
          try:
              profileio.decrypt_bundle(sealed, "salah-sandi")
          except profileio.ProfileIOError:
              pass
          else:
              raise SystemExit("wrong password was accepted")
          print("encryption ok")
          PY

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build
